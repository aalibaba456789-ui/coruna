name: Build iOS dylibs
on:
  workflow_dispatch:  # 手动触发

jobs:
  build-all:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      # ------------------------------------------------------------------
      # Trigon (Photon) dylib
      # ------------------------------------------------------------------
      - name: Build Trigon (Photon) dylib
        working-directory: src/trigon
        run: |
          set -euo pipefail
          SRCS=$(find . -maxdepth 1 \( -name "*.c" -o -name "*.S" \) | sort | tr '\n' ' ')
          echo "Sources: $SRCS"
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 -arch arm64e \
            -miphoneos-version-min=13.0 \
            -O2 -fPIC \
            -framework CoreFoundation \
            -framework IOSurface \
            -framework IOKit \
            -install_name "@rpath/trigon_photon.dylib" \
            -o trigon_photon.dylib \
            $SRCS
          ls -lh trigon_photon.dylib
          file trigon_photon.dylib

      # ------------------------------------------------------------------
      # kfd dylib
      # ------------------------------------------------------------------
      - name: Build kfd dylib
        working-directory: src/kfd
        run: |
          set -euo pipefail

          # kfd 是纯头文件库，直接 include libkfd.h 即可
          cat > /tmp/kfd_wrapper.c << 'EOF'
          #include <stdio.h>
          #include <stdint.h>
          #include <assert.h>
          #include "libkfd.h"

          typedef uint64_t u64;

          u64 kfd_open(u64 pages, int method) {
              return kopen(pages, (u64)method, 0, 0);
          }
          void kfd_read(u64 kfd, u64 addr, void *buf, u64 size) {
              kread(kfd, addr, buf, size);
          }
          void kfd_write(u64 kfd, void *buf, u64 addr, u64 size) {
              kwrite(kfd, buf, addr, size);
          }
          void kfd_close(u64 kfd) {
              (void)kfd;
          }
          EOF

          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 \
            -miphoneos-version-min=16.0 \
            -O2 -fPIC \
            -I . \
            -I libkfd \
            -I libkfd/krkw -I libkfd/krkw/kread -I libkfd/krkw/kwrite \
            -I libkfd/info -I libkfd/puaf \
            -Wno-implicit-function-declaration \
            -Wno-unused-variable \
            -Wno-incompatible-pointer-types \
            -Wno-int-conversion \
            -Wno-pointer-sign \
            -install_name "@rpath/kfd.dylib" \
            -o kfd.dylib \
            /tmp/kfd_wrapper.c
          ls -lh kfd.dylib
          file kfd.dylib

      # ------------------------------------------------------------------
      # Titan (Sparrow/Rocket) dylib
      # ------------------------------------------------------------------
      - name: Build Titan (Sparrow/Rocket) dylib
        working-directory: src/titan
        run: |
          set -euo pipefail

          # 创建 libjailbreak stub
          mkdir -p external/lib external/include/libjailbreak
          cat > /tmp/jb_stub.c << 'EOF'
          #include <stdint.h>
          int jbclient_initialize_primitives(void) { return 0; }
          void jbinfo_initialize_hardcoded_offsets(void) {}
          void libjailbreak_translation_init(void) {}
          EOF

          cat > external/include/libjailbreak/libjailbreak.h << 'EOF'
          #ifndef LIBJAILBREAK_H
          #define LIBJAILBREAK_H
          #include <stdint.h>
          int jbclient_initialize_primitives(void);
          void jbinfo_initialize_hardcoded_offsets(void);
          void libjailbreak_translation_init(void);
          #endif
          EOF

          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -arch arm64e \
            -miphoneos-version-min=16.1 \
            -install_name "@rpath/libjailbreak.dylib" \
            -o external/lib/libjailbreak.dylib /tmp/jb_stub.c
          ls -lh external/lib/libjailbreak.dylib

          # 收集 Titan 源文件
          SRCS=$(find src -type f \( -name "*.c" -o -name "*.m" -o -name "*.mm" \) | sort | tr '\n' ' ')
          echo "Sources: $SRCS"

          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 -arch arm64e \
            -miphoneos-version-min=16.1 \
            -O2 -fPIC \
            -fobjc-arc \
            -I . -I external/include -L external/lib \
            -framework CoreFoundation \
            -framework IOSurface \
            -framework IOKit \
            -framework Security \
            -ljailbreak \
            -Wno-implicit-function-declaration \
            -install_name "@rpath/titan_sparrow.dylib" \
            -o titan_sparrow.dylib \
            $SRCS
          ls -lh titan_sparrow.dylib
          file titan_sparrow.dylib

      # ------------------------------------------------------------------
      # Collect artifacts
      # ------------------------------------------------------------------
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts

          TRIGON=src/trigon/trigon_photon.dylib
          KFD=src/kfd/kfd.dylib
          TITAN=src/titan/titan_sparrow.dylib

          for f in "$TRIGON" "$KFD" "$TITAN"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected dylib: $f"
              exit 1
            fi
            cp "$f" artifacts/
          done

          echo "Collected artifacts:"
          ls -lh artifacts/

      # ------------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------------
      - name: Upload dylibs
        uses: actions/upload-artifact@v4
        with:
          name: ios-dylibs
          path: artifacts/*.dylib
          if-no-files-found: error