name: Bootstrap disasm linux
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
          llvm-objdump --version | head -3

      - name: Disassemble arm64
        working-directory: src/bootstrap
        run: |
          set -euo pipefail
          OD=$(command -v llvm-objdump || ls /usr/lib/llvm-*/bin/llvm-objdump | head -1)
          echo "using $OD"
          "$OD" --macho --arch=arm64 -d bootstrap.dylib > disasm.txt 2>&1 || "$OD" -d bootstrap.dylib > disasm.txt 2>&1 || true
          wc -l disasm.txt
          "$OD" --macho --arch=arm64 --syms bootstrap.dylib > syms.txt 2>&1 || true
          head -30 disasm.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-disasm-linux
          path: |
            src/bootstrap/disasm.txt
            src/bootstrap/syms.txt
          if-no-files-found: error
