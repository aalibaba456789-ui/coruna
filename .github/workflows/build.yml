name: Build
on: workflow_dispatch
jobs:
  trigon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd src/trigon
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 -miphoneos-version-min=13.0 -O2 -fPIC -framework CoreFoundation -framework IOSurface -framework IOKit -install_name @rpath/trigon_photon.dylib -o trigon_photon.dylib *.c *.S
          ls -lh trigon_photon.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: trigon
          path: src/trigon/trigon_photon.dylib

  kfd:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd src/kfd
          cat > /tmp/kfd_main.c << 'CEOF'
#include <stdio.h>
#include <stdint.h>
#include <assert.h>
#include "libkfd.h"

typedef uint64_t u64;

u64 kfd_open(u64 pages, int method) {
    return kopen(pages, (u64)method, 0, 0);
}

void kfd_read(u64 kfd, u64 addr, void *buf, u64 size) {
    kread(kfd, addr, buf, size);
}

void kfd_write(u64 kfd, void *buf, u64 addr, u64 size) {
    kwrite(kfd, buf, addr, size);
}

void kfd_close(u64 kfd) {
    (void)kfd;
}
CEOF
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
            -miphoneos-version-min=16.0 -O2 -fPIC \
            -I . \
            -Wno-implicit-function-declaration \
            -Wno-unused-variable \
            -Wno-incompatible-pointer-types \
            -install_name @rpath/kfd.dylib \
            -o kfd.dylib \
            /tmp/kfd_main.c
          ls -lh kfd.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: kfd
          path: src/kfd/kfd.dylib