name: Build iOS dylibs

on:
  workflow_dispatch:

jobs:
  build-trigon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Trigon
        run: |
          cd src/trigon
          ls -la
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 \
            -miphoneos-version-min=13.0 \
            -O2 -fPIC \
            -framework CoreFoundation \
            -framework IOSurface \
            -framework IOKit \
            -install_name "@rpath/trigon_photon.dylib" \
            -o trigon_photon.dylib \
            *.c *.S
          ls -lh trigon_photon.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: trigon-photon
          path: src/trigon/trigon_photon.dylib

  build-kfd:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build kfd
        run: |
          cd src/kfd
          ls -la
          # wrapper - kclose 不存在，用空实现
          cat > /tmp/kfd_wrapper.c << 'WEOF'
#include <stdint.h>
typedef uint64_t u64;
extern u64 kopen(u64 puaf_pages, u64 puaf_method, u64 kread_method, u64 kwrite_method);
extern void kread(u64 kfd, u64 kaddr, void* uaddr, u64 size);
extern void kwrite(u64 kfd, void* uaddr, u64 kaddr, u64 size);
u64 kfd_open(u64 pages, int method) { return kopen(pages, (u64)method, 0, 0); }
void kfd_read(u64 kfd, u64 addr, void *buf, u64 size) { kread(kfd, addr, buf, size); }
void kfd_write(u64 kfd, void *buf, u64 addr, u64 size) { kwrite(kfd, buf, addr, size); }
void kfd_close(u64 kfd) { /* no-op, cleanup handled internally */ }
WEOF
          SRCS=$(find libkfd -name "*.c" | tr '\n' ' ')
          echo "Sources: $SRCS"
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 \
            -miphoneos-version-min=16.0 \
            -O2 -fPIC -I libkfd \
            -Wno-implicit-function-declaration \
            -include libkfd/libkfd.h \
            -install_name "@rpath/kfd.dylib" \
            -o kfd.dylib \
            /tmp/kfd_wrapper.c $SRCS
          ls -lh kfd.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: kfd
          path: src/kfd/kfd.dylib

  build-titan:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Titan
        run: |
          cd src/titan
          ls -la
          mkdir -p external/lib external/include/libjailbreak
          # stub libjailbreak
          cat > /tmp/jb.c << 'JEOF'
#include <stdint.h>
int jbclient_initialize_primitives(void) { return 0; }
void jbinfo_initialize_hardcoded_offsets(void) {}
void libjailbreak_translation_init(void) {}
JEOF
          cat > external/include/libjailbreak/libjailbreak.h << 'HEOF'
#ifndef JB_H
#define JB_H
#include <stdint.h>
int jbclient_initialize_primitives(void);
void jbinfo_initialize_hardcoded_offsets(void);
void libjailbreak_translation_init(void);
#endif
HEOF
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64 \
            -miphoneos-version-min=16.1 -o external/lib/libjailbreak.dylib /tmp/jb.c
          SRCS=$(find src -name "*.c" -o -name "*.m" | tr '\n' ' ')
          echo "Sources: $SRCS"
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 \
            -miphoneos-version-min=16.1 \
            -O2 -fPIC -I . -I external/include -L external/lib \
            -framework CoreFoundation -framework IOSurface -framework IOKit \
            -ljailbreak -Wno-implicit-function-declaration \
            -install_name "@rpath/titan_sparrow.dylib" \
            -o titan_sparrow.dylib \
            $SRCS
          ls -lh titan_sparrow.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: titan-sparrow
          path: src/titan/titan_sparrow.dylib