name: build-nb-last

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64e dylib
        working-directory: src/nb_last
        run: |
          set -euo pipefail
          xcrun -sdk iphoneos clang -dynamiclib -arch arm64e \
            -miphoneos-version-min=14.0 -O2 -fPIC -fblocks \
            -install_name nb_last.dylib -o nb_last.dylib nb_last.c
          ls -lh nb_last.dylib
          file nb_last.dylib
          nm -gU nb_last.dylib | head -20 || true
      - name: Sign
        working-directory: src/nb_last
        run: |
          set -euo pipefail
          command -v ldid >/dev/null 2>&1 || brew install ldid >/dev/null 2>&1
          ldid -S nb_last.dylib
          file nb_last.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: nb_last
          path: src/nb_last/nb_last.dylib
          if-no-files-found: error
