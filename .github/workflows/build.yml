name: Build iOS dylibs
on:
  workflow_dispatch:
jobs:
  build-all:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install libarchive
          curl -LO https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x ldid_macosx_arm64
          sudo mv ldid_macosx_arm64 /usr/local/bin/ldid

      - name: Build Trigon (Photon) dylib
        run: |
          git clone --depth 1 https://github.com/alfiecg24/Trigon.git /tmp/Trigon
          cd /tmp/Trigon/Trigon/Exploit
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 -arch arm64e \
            -miphoneos-version-min=13.0 \
            -O2 -fPIC \
            -framework CoreFoundation \
            -framework IOSurface \
            -framework IOKit \
            -install_name "@rpath/trigon_photon.dylib" \
            -o trigon_photon.dylib \
            *.c *.S
          ldid -S trigon_photon.dylib
          ls -lh trigon_photon.dylib
          cp trigon_photon.dylib /tmp/trigon_photon.dylib

      - name: Build libjailbreak from Dopamine
        run: |
          git clone --recursive https://github.com/opa334/Dopamine.git /tmp/Dopamine
          cd /tmp/Dopamine/BaseBin
          make libjailbreak 2>&1 || {
            cd /tmp/Dopamine/BaseBin
            SRCS=$(find libjailbreak/src -name "*.c" -o -name "*.m" | tr '\n' ' ')
            xcrun -sdk iphoneos clang \
              -dynamiclib -arch arm64 -arch arm64e \
              -miphoneos-version-min=15.0 \
              -I libjailbreak/src \
              -I _external/include \
              -I ChOma/include \
              -framework CoreFoundation \
              -framework IOKit \
              -o /tmp/libjailbreak.dylib \
              $SRCS
          }
          ls -lh /tmp/libjailbreak.dylib 2>/dev/null || ls -lh /tmp/Dopamine/BaseBin/libjailbreak.dylib

      - name: Build kfd dylib
        run: |
          cd src/kfd
          cat > /tmp/kfd_wrapper.c << 'EOF'
          #include <stdint.h>
          extern uint64_t kopen(uint64_t puaf_pages, uint64_t puaf_method, uint64_t kread_method, uint64_t kwrite_method);
          extern void kread(uint64_t kfd, uint64_t kaddr, void* uaddr, uint64_t size);
          extern void kwrite(uint64_t kfd, void* uaddr, uint64_t kaddr, uint64_t size);
          extern void kclose(uint64_t kfd);
          uint64_t kfd_open(uint64_t pages, int method) { return kopen(pages, (uint64_t)method, 0, 0); }
          void kfd_read(uint64_t kfd, uint64_t addr, void *buf, uint64_t size) { kread(kfd, addr, buf, size); }
          void kfd_write(uint64_t kfd, void *buf, uint64_t addr, uint64_t size) { kwrite(kfd, buf, addr, size); }
          void kfd_close(uint64_t kfd) { kclose(kfd); }
          EOF
          INCLUDES=$(find kfd/libkfd -type d | sed 's/^/-I /' | tr '\n' ' ')
          SRCS=$(find kfd/libkfd -name "*.c" | tr '\n' ' ')
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 \
            -miphoneos-version-min=16.0 \
            -O2 -fPIC \
            $INCLUDES \
            -Wno-implicit-function-declaration \
            -install_name "@rpath/kfd.dylib" \
            -o kfd.dylib \
            /tmp/kfd_wrapper.c $SRCS
          ldid -S kfd.dylib
          ls -lh kfd.dylib

      - name: Build Titan (Sparrow/Rocket) dylib
        run: |
          cd src/titan
          JB=$(find /tmp/Dopamine -name "libjailbreak.dylib" | head -1)
          if [ -z "$JB" ]; then
            JB="/tmp/Dopamine/BaseBin/libjailbreak.dylib"
          fi
          mkdir -p external/lib external/include
          cp "$JB" external/lib/libjailbreak.dylib
          cp -r /tmp/Dopamine/BaseBin/libjailbreak/src/*.h external/include/ 2>/dev/null || true
          SRCS=$(find src -name "*.c" -o -name "*.m" | tr '\n' ' ')
          xcrun -sdk iphoneos clang \
            -dynamiclib -arch arm64 -arch arm64e \
            -miphoneos-version-min=16.1 \
            -O2 -fPIC \
            -I . -I external/include \
            -L external/lib \
            -framework CoreFoundation -framework IOSurface -framework IOKit \
            -ljailbreak \
            -Wno-implicit-function-declaration \
            -install_name "@rpath/titan_sparrow.dylib" \
            -o titan_sparrow.dylib \
            $SRCS
          ldid -S titan_sparrow.dylib
          ls -lh titan_sparrow.dylib

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp /tmp/trigon_photon.dylib artifacts/ 2>/dev/null || true
          cp src/kfd/kfd.dylib artifacts/ 2>/dev/null || true
          cp src/titan/titan_sparrow.dylib artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload dylibs
        uses: actions/upload-artifact@v4
        with:
          name: ios-dylibs
          path: artifacts/*.dylib